[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oicoach-runtime"
version = "0.19.1"
description = "Durable, workflow-independent OI agent runtime infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["prompt-toolkit>=3.0.52,<4", "tiktoken>=0.8,<1"]

[project.optional-dependencies]
tijian = ["mcp>=1.28,<2"]
test = ["pyte>=0.8,<1"]

[project.scripts]
oicoach-runtime = "oicoach_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oicoach_runtime = ["migrations/*.sql", "bundled/*.md", "bundled/*.mjs"]
