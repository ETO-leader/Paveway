[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oicoach-runtime"
version = "0.8.0"
description = "Durable, workflow-independent OI agent runtime infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
tijian = ["mcp>=1.28,<2"]

[project.scripts]
oicoach-runtime = "oicoach_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oicoach_runtime = ["migrations/*.sql", "bundled/*.md"]
