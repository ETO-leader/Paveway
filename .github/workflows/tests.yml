name: tests
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[test]'
      - name: Install private D-Bus notification test dependencies
        run: sudo apt-get update && sudo apt-get install -y dbus-daemon libnotify-bin libglib2.0-bin python3-gi
      - run: python -m unittest discover -s tests -v
      - run: oicoach-runtime --help
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - omp-version: '19.0.0'
            replacement-version: '19.1.1'
          - omp-version: '19.1.1'
            replacement-version: '19.0.0'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install and verify official OMP release
        env:
          OMP_VERSION: ${{ matrix.omp-version }}
          OMP_REPLACEMENT_VERSION: ${{ matrix.replacement-version }}
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d "$RUNNER_TEMP/omp.XXXXXXXX")"
          install_omp() (
            cd "$(mktemp -d "$RUNNER_TEMP/omp-download.XXXXXXXX")"
            release="https://github.com/can1357/oh-my-pi/releases/download/v$1"
            curl -fsSL --retry 3 -O "$release/SHA256SUMS.txt"
            curl -fsSL --retry 3 -O "$release/omp-linux-x64"
            awk '$2 == "omp-linux-x64" { print }' SHA256SUMS.txt | sha256sum --check --strict
            install -m 0755 omp-linux-x64 "$2"
            rm omp-linux-x64 SHA256SUMS.txt
          )
          install_omp "$OMP_VERSION" "$install_dir/omp"
          install_omp "$OMP_REPLACEMENT_VERSION" "$install_dir/omp-replacement"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
          printf 'PAVEWAY_TEST_REPLACEMENT_OMP=%s\n' "$install_dir/omp-replacement" >> "$GITHUB_ENV"
      - name: Check official OMP and JS test prerequisites (no silent skip)
        env:
          OMP_VERSION: ${{ matrix.omp-version }}
        run: |
          python -c 'import pyte; from shutil import which; assert which("omp")'
          python -c 'import os; from oicoach_runtime.omp_installation import omp_version, resolve_omp; assert omp_version(resolve_omp()) == os.environ["OMP_VERSION"]'
          bun --version
      - name: Bun UI regressions and synthetic memory pressure
        env:
          PYTHONPATH: src:tests
        run: |
          bun test tests/*.test.mjs
          python -m unittest -v test_omp_memory_boundaries.MemoryPressureTests
      - name: Real OMP complete Skill package (ZIP install, restart, skill:// reads; no model)
        env:
          PAVEWAY_TEST_NATIVE: '1'
          PAVEWAY_REQUIRE_REAL_OMP_PACKAGE: '1'
          PYTHONPATH: src:tests
        run: python -m unittest -v test_skill_packages_omp
      - name: Official OMP with local provider and PTY (no external model)
        env:
          PAVEWAY_TEST_NATIVE: '1'
          PYTHONPATH: src:tests
        run: |
          python -m unittest -v \
            test_native_omp \
            test_native_banner \
            test_native_conversation \
            test_native_statusline \
            test_native_management.NativeManagementTests.test_cwd_dialog_cancels_or_opens_a_new_conversation_with_resumable_history \
            test_native_management.NativeManagementTests.test_direct_cwd_loads_target_project_context_without_losing_profile_and_inference \
            test_native_management.NativeManagementTests.test_cwd_waits_for_foreground_activity_without_interrupting_running_background \
            test_native_mcp.NativeWorkflowMcpPtyTests \
            test_native_management.NativeManagementTests.test_settings_is_reachable_from_native_paveway_menu_without_chat \
            test_native_management.NativeManagementTests.test_skill_dialog_preserves_category_and_body_without_chat_submission \
            test_native_management.NativeManagementTests.test_skill_file_import_analyzes_reviews_and_saves_without_chat_history \
            test_native_management.NativeManagementTests.test_local_multi_skill_zip_selects_two_with_conflict_and_no_model_request \
            test_native_management.NativeManagementTests.test_packaged_skill_read_only_view_lists_and_shows_files \
            test_native_management.NativeManagementTests.test_local_multi_skill_zip_select_all_then_cancel_writes_nothing \
            test_native_management.NativeManagementTests.test_sync_status_shows_incomplete_history_without_model_request \
            test_native_management.NativeManagementTests.test_skill_import_invalid_analysis_does_not_save \
            test_native_management.NativeManagementTests.test_skill_import_conflict_keeps_draft_and_preserves_concurrent_settings \
            test_native_management.NativeManagementTests.test_memory_context_explicit_off_and_on_changes_next_model_request \
            test_system_prompt_template.RealOmpTemplateSmokeTests \
            test_native_recovery \
            test_native_capabilities.NativeCapabilityTests.test_native_memory_tool_persists_scoped_fact_and_reports_version \
            test_native_capabilities.NativeCapabilityTests.test_native_mcp_discovers_and_invokes_stdio_server \
            test_native_capabilities.NativeCapabilityTests.test_native_subagent_uses_its_own_session_and_returns_result \
            test_native_capabilities.NativeCapabilityTests.test_training_checkpoint_reads_latest_task_note_after_native_exit
